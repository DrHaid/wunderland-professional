[project]
name = "wunderland-professional"
version = "1.2.1"
description = "Wunderland desktop wallpaper and Microsoft Teams background."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gooey>=1.0.8.1",
    "numpy>=2.4.2",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "pyinstaller>=6.18.0",
    "pywal>=3.8.14",
    "requests>=2.32.5",
    "six>=1.17.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
]
